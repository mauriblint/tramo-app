# /etc/nginx/sites-available/tramo  (symlink into sites-enabled)
# Same shape as chaptergen: static frontend + /api proxied to the pm2 backend.
# Replace SERVER_NAME with the real (sub)domain.
server {
    listen 80;
    server_name SERVER_NAME;

    root /var/www/tramo/frontend/dist;
    index index.html;

    # The site is public; the API is protected by account sessions (see backend/src/auth.ts).

    # Forwarded booking emails (from the Cloudflare Email Worker) carry attachments: allow up to 25 MB.
    location = /api/inbound/email {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Route proposals and itinerary turns can take ~30-60s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # The service worker must never be cached, or updates get stuck on phones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
