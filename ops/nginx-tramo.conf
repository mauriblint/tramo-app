# /etc/nginx/sites-available/tramo  (symlink into sites-enabled)
# Same shape as chaptergen: static frontend + /api proxied to the pm2 backend.
# Replace SERVER_NAME with the real (sub)domain.
server {
    listen 80;
    server_name SERVER_NAME;

    root /var/www/tramo/frontend/dist;
    index index.html;

    # Private beta: one shared user/password keeps strangers from spending the OpenAI key.
    # Create it with:  printf "USER:$(openssl passwd -apr1)\n" > /etc/nginx/tramo.htpasswd
    auth_basic "tramo";
    auth_basic_user_file /etc/nginx/tramo.htpasswd;

    # Icons/manifest must load without credentials or "Add to Home Screen" ends up without an icon.
    location ~ ^/(manifest\.webmanifest|favicon\.ico|logo\.svg|apple-touch-icon.*\.png|pwa-.*\.png|maskable-.*\.png)$ {
        auth_basic off;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Route proposals and itinerary turns can take ~30-60s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # The service worker must never be cached, or updates get stuck on phones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
